name: CI Pipeline

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]

jobs:
  backend-test-and-build:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        working-directory: apps/api
        run: |
          chmod +x mvnw
          ./mvnw clean test

      - name: Package Backend JAR
        working-directory: apps/api
        run: ./mvnw package -DskipTests

  frontend-test-and-build:
    name: Frontend (Node 22 / Vite / React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Type-Check & Build Web App
        run: pnpm --filter @placement/web run build
